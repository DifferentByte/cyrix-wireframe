<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyrix Purchase AOS · UI Prototype</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="UI/assets/cyrix-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>
:root{ --bg:#f5f5f6; --surface:#fff; --ink:#141414; --ink-soft:#5c5c5c; --line:#ececec; --accent:#d32f2f; --accent-soft:#fdecec; }
@media (prefers-color-scheme:dark){
  :root{ --bg:#0d0d0d; --surface:#171717; --ink:#f2f2f2; --ink-soft:#a8a8a8; --line:#262626; --accent-soft:#2a1414; }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.mi{font-family:"Material Symbols Outlined";font-size:28px;line-height:1;font-weight:400}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:820px}
.brand{text-align:center;margin-bottom:32px}
.brand img{height:44px}
.brand p{margin:10px 0 0;color:var(--ink-soft)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 3px 6px rgba(0,0,0,.06);transition:transform .15s ease,border-color .15s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.icon{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.card h2{margin:0;font-size:22px}
.card p{margin:0;color:var(--ink-soft)}
.go{margin-top:14px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.go .mi{font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="UI/assets/cyrix-logo.png" alt="Cyrix">
    <p>Purchase AOS · UI prototype</p>
  </div>
  <div class="roles">
    <a class="card" href="UI/index.html">
      <div class="icon"><span class="mi">badge</span></div>
      <h2>Employee flow</h2>
      <p>Raise, source, order and receive purchases.</p>
      <span class="go">Open <span class="mi">arrow_forward</span></span>
    </a>
    <a class="card" href="UI/superadmin/index.html">
      <div class="icon"><span class="mi">admin_panel_settings</span></div>
      <h2>Super admin flow</h2>
      <p>Manage roles, access and monitor every stage.</p>
      <span class="go">Open <span class="mi">arrow_forward</span></span>
    </a>
  </div>
</div>
</body>
</html>
