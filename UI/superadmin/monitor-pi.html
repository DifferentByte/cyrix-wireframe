<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI Unified data</title>
<link rel="icon" href="../assets/cyrix-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<link rel="stylesheet" href="../assets/cyrix-ui.css">
<link rel="stylesheet" href="sa.css">
</head>
<body>
<main class="content">

  <!-- Header: title left; the data-source controls collapse into one compact line -->
  <div class="page-head">
    <div>
      <div class="crumb">Super Admin · Monitor &amp; act</div>
      <h1>PI Unified data</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="actions">
      <span class="badge info"><span class="mi" style="font-size:14px">visibility</span>Super Admin view · all teams</span>
      <div class="pop-wrap">
        <button class="sync-pill" id="syncBtn" type="button" aria-expanded="false" title="Background refresh status per portal"><span class="dot"></span><span id="syncLabel">Checking sources…</span></button>
        <div class="pop pop-right" id="syncPop" hidden><div class="sync-list" id="syncList"></div></div>
      </div>
      <div id="range"></div>
      <button class="btn primary" id="refresh" type="button"><span class="mi">play_arrow</span>Load data</button>
    </div>
  </div>

  <div id="empty" class="alert bad" hidden>No stored data found — assets/mock-data.js didn't load.</div>

  <div class="stack" id="body">
    <!-- One row replaces the old KPI cards + quick views: approval stages as a single-choice filter -->
    <div class="stage-row">
      <div class="stage-tabs" id="stageTabs" role="tablist" aria-label="Approval stage"></div>
      <button class="btn" id="summaryBtn" type="button" aria-expanded="false"><span class="mi">insights</span>Summary<span class="mi" id="sumArrow">expand_more</span></button>
    </div>

    <div class="pi-layout" id="layout">
      <aside class="card filter-panel" id="filterPanel"></aside>

      <div class="pi-main">
        <!-- Summary: collapsed by default, remembered -->
        <section class="stack" id="summary" hidden>
          <div class="seg insight-tabs" id="sumTabs">
            <button type="button" class="on" data-val="overview">Overview</button>
            <button type="button" data-val="pivot">Pivot</button>
          </div>
          <div id="sumBody"></div>
        </section>

        <div class="card">
          <div class="card-b stack">
            <div class="toolbar">
              <button class="btn" id="showFilters" type="button" hidden><span class="mi">filter_list</span>Filters<span class="facet-n" id="filterCount" hidden></span></button>
              <div class="search"><span class="mi">search</span><input type="search" id="q" placeholder="Search anything — indent, item, requestor, status, who holds it…"></div>
              <div class="seg" id="viewSeg">
                <button type="button" class="on" data-val="table" title="One consistent set of columns across all states">Table</button>
                <button type="button" data-val="raw" title="Each state's own portal column names">Raw</button>
              </div>
              <div class="pop-wrap" id="colsWrap">
                <button class="btn" id="colsBtn" type="button" aria-expanded="false"><span class="mi">view_column</span>Columns <span class="faint" id="colsCount"></span></button>
                <div class="pop pop-right" id="colsPop" hidden>
                  <div class="pop-top"><button class="link-btn" type="button" data-cols="all">All</button></div>
                  <div class="pop-list" id="colsList"></div>
                </div>
              </div>
              <button class="btn" id="exportBtn" type="button" title="Download the filtered records as CSV"><span class="mi">download</span>Export</button>
            </div>

            <div class="chips" id="chips" hidden></div>
            <p class="small faint" id="rowcount"></p>

            <div class="table-wrap" id="tableWrap">
              <table class="t full-table">
                <thead id="thead"></thead>
                <tbody id="recordRows"></tbody>
              </table>
            </div>
            <div id="rawGroups" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="small faint mt">Stored snapshot of real Cyrix data — identical to what employees see on their PI Unified data page, plus who currently holds each record.</p>

  <!-- Record drawer: every field of one record -->
  <div class="drawer-bg" id="drawerBg" hidden>
    <aside class="drawer" role="dialog" aria-label="Record details">
      <header class="drawer-h">
        <div>
          <div class="row" id="drawerBadges"></div>
          <h2 id="drawerTitle"></h2>
          <p class="sub" id="drawerDesc"></p>
        </div>
        <button type="button" class="icon-x" id="drawerClose" title="Close"><span class="mi">close</span></button>
      </header>
      <div class="drawer-b" id="drawerBody"></div>
    </aside>
  </div>

  <div class="modal-bg" id="galleryModal">
    <div class="modal" style="width:min(720px,100%)">
      <div class="card-h"><h2>Attachments</h2><button class="btn sm tag" data-close type="button">✕</button></div>
      <div class="card-b gallery-grid" id="galleryBody"></div>
    </div>
  </div>
</main>

<script src="../assets/mock-data.js"></script>
<script src="../assets/cyrix-range.js"></script>
<script src="sa-data.js"></script>
<script src="../assets/cyrix-shell.js"></script>
<script src="sa-ui.js"></script>
<script>
(function () {
  var API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
  var MOCK = window.CX_MOCK || {};
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString("en-IN"); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function isoDay(ms) { if (!ms) return ""; var d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function norm(v) { return String(v == null ? "" : v).trim().toLowerCase(); }
  function persist(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ---------- data: the stored sample, enriched with derived fields ---------- */
  var G_AWAIT = "Awaiting approval", G_APPR = "Approved", G_PROC = "In procurement", G_REJ = "Rejected / cancelled";
  var STAGES = [G_AWAIT, G_APPR, G_PROC, G_REJ];
  // Each portal words statuses differently, so group them into the four stages people think in.
  function statusGroup(s) {
    s = norm(s);
    if (/reject|cancel/.test(s)) return G_REJ;
    if (/^approved/.test(s)) return G_APPR;
    if (/^(pr|po) initiated|dispatch|deliver|grn|closed|complete/.test(s)) return G_PROC;
    return G_AWAIT;
  }
  var ZMAP = { AP: "Andhra Pradesh", UP: "Uttar Pradesh", Rajasthan: "Rajasthan", Kerala: "Kerala" };
  function hash(x) { var h = 0; for (var i = 0; i < x.length; i++) h = (h * 31 + x.charCodeAt(i)) >>> 0; return h; }
  function holder(r) {
    var z = ZMAP[r.state] || r.state, act = SA.EMPLOYEES.filter(function (e) { return e.status === "active"; });
    var pool = act.filter(function (e) { return (e.team === "purchase" || e.team === "approvals") && (e.zones === "all" || e.zones.indexOf(z) >= 0); });
    if (!pool.length) pool = act.filter(function (e) { return e.team === "purchase"; });
    return pool[hash(r.id) % pool.length];
  }
  var ALL = (MOCK.calls || []).map(function (r) {
    var d = CXR.parse(r.date), ts = d ? d.getTime() : 0, h = holder(r);
    return {
      state: r.state || "", typeL: r.call_type === "current_call" ? "Online" : "Offline", call_type: r.call_type,
      id: r.id || "", desc: r.desc || "", requestor: r.requestor || "", status: r.status || "", date: r.date || "",
      images: r.images || [], heldBy: h.name, heldTeam: SA.teamName(h.team), heldId: h.id, ts: ts, day: isoDay(ts), group: statusGroup(r.status), hasImg: (r.images || []).length ? "Yes" : "No",
      search: [r.id, r.desc, r.requestor, r.status, r.state, r.date, h.name, SA.teamName(h.team)].join(" ").toLowerCase()
    };
  });
  var rows = [];                       // ALL cut to the header's date range

  /* ---------- filter state ---------- */
  var FIELD = { state: "State", typeL: "Call type", group: "Status group", status: "Status", hasImg: "Has attachments", requestor: "Requestor", day: "Created day", heldBy: "Held by", heldTeam: "Held by team", id: "Indent / Ticket", desc: "Description", date: "Date" };
  var FACETS = [["state", true], ["typeL", true], ["group", true], ["heldTeam", true], ["heldBy", false], ["status", false], ["hasImg", false], ["requestor", false]];
  var DIMS = ["state", "typeL", "group", "heldTeam", "heldBy", "status", "hasImg", "requestor", "day"];
  var COND_FIELDS = [["id", "text"], ["desc", "text"], ["requestor", "text"], ["status", "text"], ["state", "text"], ["heldBy", "text"], ["heldTeam", "text"], ["date", "date"]];
  var OPS = {
    text: [["contains", "contains"], ["not_contains", "does not contain"], ["eq", "is"], ["starts", "starts with"], ["empty", "is empty"], ["not_empty", "is not empty"]],
    date: [["on", "is on"], ["before", "is before"], ["after", "is after"], ["between", "is between"]]
  };
  var f = { q: "", facets: {}, conds: [], match: "all" };
  var ui = { open: {}, showAll: {}, facetQ: {}, advOpen: false, summary: recall("cyrix.pi.summary") === "1", sumTab: "overview", topDim: "heldBy", pvRow: "heldTeam", pvCol: "group", view: "table", filters: true, sortKey: "__date", sortDir: -1, cols: null, seq: 0 };

  var COLS = [["state", "State"], ["typeL", "Type"], ["id", "Indent / Ticket"], ["desc", "Description"], ["requestor", "Requestor"], ["status", "Status"], ["date", "Date"], ["heldBy", "Held by"], ["images", "Images"]];
  ui.cols = COLS.map(function (c) { return c[0]; });

  function isComplete(c) { return c.op === "empty" || c.op === "not_empty" || (c.v1 && (c.op !== "between" || c.v2)); }
  function dayStart(ms) { var d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function condMatch(r, c) {
    var kind = c.field === "date" ? "date" : "text", raw = r[c.field];
    if (c.op === "empty") return !String(raw).trim();
    if (c.op === "not_empty") return !!String(raw).trim();
    if (kind === "date") {
      if (!r.ts) return false;
      var d = dayStart(r.ts), a = dayStart(CXR.parse(c.v1).getTime()), b = c.v2 ? dayStart(CXR.parse(c.v2).getTime()) : a;
      return c.op === "on" ? d === a : c.op === "before" ? d < a : c.op === "after" ? d > a : d >= Math.min(a, b) && d <= Math.max(a, b);
    }
    var v = norm(raw), w = norm(c.v1);
    return c.op === "contains" ? v.indexOf(w) >= 0 : c.op === "not_contains" ? v.indexOf(w) < 0 : c.op === "eq" ? v === w : v.indexOf(w) === 0;
  }
  // Rows matching every active filter; `skip` leaves one facet out so option counts show what switching would give.
  function apply(list, skip) {
    var terms = f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var facets = Object.keys(f.facets).filter(function (k) { return k !== skip && f.facets[k].length; });
    var conds = f.conds.filter(isComplete);
    return list.filter(function (r) {
      if (!terms.every(function (t) { return r.search.indexOf(t) >= 0; })) return false;
      if (!facets.every(function (k) { return f.facets[k].some(function (v) { return norm(v) === norm(r[k]); }); })) return false;
      if (!conds.length) return true;
      return f.match === "all" ? conds.every(function (c) { return condMatch(r, c); }) : conds.some(function (c) { return condMatch(r, c); });
    });
  }
  // Group by a field (case-insensitive), labelled with the most common spelling.
  function tally(list, k) {
    var g = {};
    list.forEach(function (r) {
      var raw = String(r[k] || "").trim(), key = norm(raw);
      var e = g[key] || (g[key] = { key: key, spell: {}, rows: [], count: 0 });
      e.spell[raw] = (e.spell[raw] || 0) + 1; e.rows.push(r); e.count++;
    });
    return Object.keys(g).map(function (key) {
      var e = g[key], best = Object.keys(e.spell).sort(function (a, b) { return e.spell[b] - e.spell[a]; })[0];
      return { key: key, label: best || "(blank)", value: best || "", count: e.count, rows: e.rows };
    });
  }
  function facetOptions(k) {
    var out = tally(apply(rows, k), k);
    (f.facets[k] || []).forEach(function (sel) { if (!out.some(function (o) { return o.key === norm(sel); })) out.push({ key: norm(sel), label: sel || "(blank)", value: sel, count: 0, rows: [] }); });
    return k === "day" ? out.sort(function (a, b) { return a.key < b.key ? 1 : -1; }) : out.sort(function (a, b) { return b.count - a.count || a.label.localeCompare(b.label); });
  }
  function hasFacet(k, v) { return (f.facets[k] || []).some(function (x) { return norm(x) === norm(v); }); }
  function toggleFacet(k, v) {
    var cur = f.facets[k] || [], has = hasFacet(k, v);
    var next = has ? cur.filter(function (x) { return norm(x) !== norm(v); }) : cur.concat([v]);
    if (next.length) f.facets[k] = next; else delete f.facets[k];
  }
  function setFacet(k, vals) { if (vals.length) f.facets[k] = vals; else delete f.facets[k]; }
  function isFiltered() { return !!f.q.trim() || Object.keys(f.facets).some(function (k) { return f.facets[k].length; }) || f.conds.some(isComplete); }
  function clearAll() { f.q = ""; f.facets = {}; f.conds = []; $("q").value = ""; }

  /* ---------- header: sync pill, more menu, popovers ---------- */
  function relTime(iso) {
    if (!iso) return "never";
    var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    return s < 5 ? "just now" : s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago";
  }
  function renderSync() {
    var src = (MOCK.poolStatus && MOCK.poolStatus.sources) || [];
    var lvl = !src.length ? "unknown" : src.some(function (s) { return s.status === "stale" || s.status === "pending"; }) ? "bad" : src.some(function (s) { return s.status === "retrying"; }) ? "warn" : "ok";
    $("syncBtn").className = "sync-pill " + lvl;
    $("syncLabel").textContent = { ok: "Sources in sync", warn: "Source retrying", bad: "Sync problem", unknown: "No sync data" }[lvl];
    $("syncList").innerHTML = '<div class="faint small">Background refresh</div>' + src.map(function (s) {
      return '<div class="pool-chip ' + esc(s.status) + '" title="' + esc(s.last_error || "") + '"><span class="dot"></span><b>' + esc(s.source_name) + "</b> " + esc(s.status) + " · " + relTime(s.last_success_at) + "</div>";
    }).join("");
  }
  var POPS = [["syncBtn", "syncPop"], ["colsBtn", "colsPop"]];
  function closePops(except) { POPS.forEach(function (p) { if (p[1] !== except) { $(p[1]).hidden = true; $(p[0]).setAttribute("aria-expanded", "false"); } }); }
  POPS.forEach(function (p) {
    $(p[0]).addEventListener("click", function (e) { e.stopPropagation(); var open = $(p[1]).hidden; closePops(p[1]); $(p[1]).hidden = !open; $(p[0]).setAttribute("aria-expanded", String(open)); });
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".pop")) closePops(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closePops(); closeDrawer(); } });

  /* ---------- stage tabs ---------- */
  function renderStage() {
    var byStage = {}; facetOptions("group").forEach(function (o) { byStage[o.label] = o.count; });
    var sel = f.facets.group || [];
    var h = '<button type="button" role="tab" class="stage' + (!sel.length ? " on" : "") + '" data-stage="">All <b>' + fmt(apply(rows, "group").length) + "</b></button>";
    STAGES.forEach(function (s) {
      var on = sel.length === 1 && hasFacet("group", s);
      h += '<button type="button" role="tab" class="stage' + (on ? " on" : "") + '" data-stage="' + esc(s) + '">' + esc(s) + " <b>" + fmt(byStage[s] || 0) + "</b></button>";
    });
    $("stageTabs").innerHTML = h;
  }
  $("stageTabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-stage]"); if (!b) return;
    var s = b.getAttribute("data-stage"), on = b.classList.contains("on");
    setFacet("group", s && !on ? [s] : []); update({ panel: true });
  });

  /* ---------- filter panel ---------- */
  function facetOpen(k) { return ui.open[k] === undefined ? FACETS.filter(function (x) { return x[0] === k; })[0][1] : ui.open[k]; }
  function renderPanel() {
    var active = document.activeElement, keep = active && active.getAttribute && active.getAttribute("data-fsearch");
    var h = '<div class="fp-head"><h2>Filters</h2>' + (isFiltered() ? '<button type="button" class="link-btn" data-act="clear">Clear all</button>' : "") +
      '<button type="button" class="icon-x fp-hide" data-act="hide" title="Hide filters"><span class="mi">left_panel_close</span></button></div>';
    FACETS.forEach(function (fc) {
      var k = fc[0], open = facetOpen(k), n = (f.facets[k] || []).length;
      h += '<div class="facet' + (open ? " open" : "") + '"><button type="button" class="facet-h" data-facet="' + k + '" aria-expanded="' + open + '"><span>' + FIELD[k] + "</span>" + (n ? '<span class="facet-n">' + n + "</span>" : "") + '<span class="mi">expand_more</span></button>';
      if (open) {
        var opts = facetOptions(k), q = (ui.facetQ[k] || "").toLowerCase();
        var match = q ? opts.filter(function (o) { return o.label.toLowerCase().indexOf(q) >= 0; }) : opts;
        var list = ui.showAll[k] || q ? match : match.slice(0, 8);
        h += '<div class="facet-b">';
        if (opts.length > 8) h += '<input class="facet-search" type="search" data-fsearch="' + k + '" placeholder="Search ' + FIELD[k].toLowerCase() + '…" value="' + esc(ui.facetQ[k] || "") + '">';
        list.forEach(function (o) {
          var on = hasFacet(k, o.value);
          h += '<label class="facet-opt' + (on ? " on" : "") + (o.count === 0 ? " zero" : "") + '"><input type="checkbox" data-fopt="' + k + '" data-v="' + esc(o.value) + '"' + (on ? " checked" : "") + '><span class="facet-l" title="' + esc(o.label) + '">' + esc(o.label) + '</span><span class="facet-c">' + o.count + "</span></label>";
        });
        if (!list.length) h += '<div class="faint small">No matches</div>';
        if (!q && match.length > 8) h += '<button type="button" class="link-btn" data-showall="' + k + '">' + (ui.showAll[k] ? "Show fewer" : "Show all " + match.length) + "</button>";
        h += "</div>";
      }
      h += "</div>";
    });
    h += '<div class="facet adv' + (ui.advOpen ? " open" : "") + '"><button type="button" class="facet-h" data-act="adv" aria-expanded="' + ui.advOpen + '"><span>Advanced rules</span>' + (f.conds.length ? '<span class="facet-n">' + f.conds.length + "</span>" : "") + '<span class="mi">expand_more</span></button>';
    if (ui.advOpen) {
      h += '<div class="facet-b"><p class="faint small">Rules on any column — e.g. Requestor contains a name, or Date is after a day.</p>';
      if (f.conds.length > 1) h += '<div class="seg"><button type="button" data-match="all" class="' + (f.match === "all" ? "on" : "") + '">Match all</button><button type="button" data-match="any" class="' + (f.match === "any" ? "on" : "") + '">Match any</button></div>';
      f.conds.forEach(function (c) { h += condRow(c); });
      h += '<button type="button" class="btn sm" data-act="addcond"><span class="mi">add</span>Add rule</button></div>';
    }
    h += "</div>";
    $("filterPanel").innerHTML = h;
    if (keep) { var el = $("filterPanel").querySelector('[data-fsearch="' + keep + '"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  }
  function condRow(c) {
    var kind = c.field === "date" ? "date" : "text", noVal = c.op === "empty" || c.op === "not_empty", type = kind === "date" ? "date" : "text";
    return '<div class="cond" data-cid="' + c.id + '"><div class="cond-top"><select data-cf="field">' +
      COND_FIELDS.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === c.field ? " selected" : "") + ">" + FIELD[x[0]] + "</option>"; }).join("") +
      '</select><button type="button" class="icon-x" data-rmcond="' + c.id + '" title="Remove rule"><span class="mi">close</span></button></div>' +
      '<select data-cf="op">' + OPS[kind].map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === c.op ? " selected" : "") + ">" + x[1] + "</option>"; }).join("") + "</select>" +
      (noVal ? "" : '<div class="cond-vals"><input type="' + type + '" data-cf="v1" placeholder="Value" value="' + esc(c.v1) + '">' +
        (c.op === "between" ? '<span class="faint small">and</span><input type="' + type + '" data-cf="v2" placeholder="Value" value="' + esc(c.v2) + '">' : "") + "</div>") + "</div>";
  }
  $("filterPanel").addEventListener("click", function (e) {
    var t = e.target, el;
    if ((el = t.closest("[data-facet]"))) { var k = el.getAttribute("data-facet"); ui.open[k] = !facetOpen(k); renderPanel(); return; }
    if ((el = t.closest("[data-showall]"))) { var s = el.getAttribute("data-showall"); ui.showAll[s] = !ui.showAll[s]; renderPanel(); return; }
    if ((el = t.closest("[data-act]"))) {
      var a = el.getAttribute("data-act");
      if (a === "clear") { clearAll(); update({ panel: true }); }
      else if (a === "hide") { ui.filters = false; layout(); }
      else if (a === "adv") { ui.advOpen = !ui.advOpen; renderPanel(); }
      else if (a === "addcond") { f.conds.push({ id: "c" + ++ui.seq, field: "requestor", op: "contains", v1: "", v2: "" }); ui.advOpen = true; renderPanel(); }
      return;
    }
    if ((el = t.closest("[data-rmcond]"))) { var id = el.getAttribute("data-rmcond"); f.conds = f.conds.filter(function (c) { return c.id !== id; }); update({ panel: true }); return; }
    if ((el = t.closest("[data-match]"))) { f.match = el.getAttribute("data-match"); update({ panel: true }); }
  });
  $("filterPanel").addEventListener("change", function (e) {
    var t = e.target, k;
    if ((k = t.getAttribute("data-fopt"))) { toggleFacet(k, t.getAttribute("data-v")); update({ panel: true }); return; }
    var row = t.closest("[data-cid]"), key = t.getAttribute("data-cf");
    if (row && key && (key === "field" || key === "op")) {
      var c = f.conds.filter(function (x) { return x.id === row.getAttribute("data-cid"); })[0];
      c[key] = t.value;
      if (key === "field") { c.op = (t.value === "date" ? OPS.date : OPS.text)[0][0]; c.v1 = ""; c.v2 = ""; }
      update({ panel: true });
    }
  });
  $("filterPanel").addEventListener("input", function (e) {
    var t = e.target, k = t.getAttribute("data-fsearch");
    if (k) { ui.facetQ[k] = t.value; renderPanel(); return; }
    var row = t.closest("[data-cid]"), key = t.getAttribute("data-cf");
    if (row && (key === "v1" || key === "v2")) { f.conds.filter(function (x) { return x.id === row.getAttribute("data-cid"); })[0][key] = t.value; update({ panel: false }); }
  });

  /* ---------- chips ---------- */
  function renderChips() {
    var chips = [];
    if (f.q.trim()) chips.push(["q", "Search: “" + f.q.trim() + "”"]);
    Object.keys(f.facets).forEach(function (k) { if (f.facets[k].length) chips.push(["f:" + k, FIELD[k] + ": " + f.facets[k].map(function (v) { return v || "(blank)"; }).join(", ")]); });
    f.conds.filter(isComplete).forEach(function (c) {
      var op = (c.field === "date" ? OPS.date : OPS.text).filter(function (x) { return x[0] === c.op; })[0][1];
      chips.push(["c:" + c.id, FIELD[c.field] + " " + op + (c.op === "empty" || c.op === "not_empty" ? "" : " " + c.v1 + (c.op === "between" ? " and " + c.v2 : ""))]);
    });
    var el = $("chips"); el.hidden = !chips.length;
    el.innerHTML = chips.map(function (c) { return '<span class="fchip"><span title="' + esc(c[1]) + '">' + esc(c[1]) + '</span><button type="button" class="icon-x" data-chip="' + esc(c[0]) + '" title="Remove filter"><span class="mi">close</span></button></span>'; }).join("") +
      '<button type="button" class="link-btn" data-chip="__all">Clear all</button>';
    var n = chips.length; $("filterCount").hidden = !n; $("filterCount").textContent = n;
  }
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-chip]"); if (!b) return;
    var id = b.getAttribute("data-chip");
    if (id === "__all") clearAll();
    else if (id === "q") { f.q = ""; $("q").value = ""; }
    else if (id.indexOf("f:") === 0) delete f.facets[id.slice(2)];
    else f.conds = f.conds.filter(function (c) { return "c:" + c.id !== id; });
    update({ panel: true });
  });
  $("q").addEventListener("input", function () { f.q = $("q").value; update({ panel: true }); });

  /* ---------- summary: overview + pivot ---------- */
  function barList(items, field, stacked) {
    var max = Math.max(1, Math.max.apply(null, items.map(function (i) { return i.count; })));
    if (!items.length) return '<div class="faint small">No matching records</div>';
    return items.map(function (i) {
      var on = hasFacet(field, i.value), online = stacked ? i.rows.filter(function (r) { return r.call_type === "current_call"; }).length : 0;
      var fill = stacked ? '<div class="seg a" style="width:' + (100 * online / i.count) + '%"></div><div class="seg b" style="width:' + (100 * (i.count - online) / i.count) + '%"></div>' : '<div class="seg solid" style="width:100%"></div>';
      return '<div class="bar-row clickable' + (on ? " active" : "") + '" data-bar="' + field + '" data-v="' + esc(i.value) + '" title="' + esc(i.label) + ": " + i.count + ' — click to filter"><div class="name" title="' + esc(i.label) + '">' + esc(i.label) +
        '</div><div class="track"><div class="fill" style="width:' + (100 * i.count / max) + '%">' + fill + '</div></div><div class="val">' + fmt(i.count) + "</div></div>";
    }).join("");
  }
  function dimOptions(sel) {
    return DIMS.map(function (d) { return '<option value="' + d + '"' + (d === sel ? " selected" : "") + ">" + FIELD[d] + "</option>"; }).join("");
  }
  function shortDay(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short" }); }
  function trend() {
    var counts = {}; facetOptions("day").forEach(function (t) { if (t.key) counts[t.key] = t.count; });
    var keys = Object.keys(counts).sort(); if (!keys.length) return '<div class="faint small">No dated records</div>';
    var days = [], end = new Date(keys[keys.length - 1] + "T00:00:00");
    for (var d = new Date(keys[0] + "T00:00:00"); d <= end && days.length < 150; d.setDate(d.getDate() + 1)) { var iso = isoDay(d.getTime()); days.push({ day: iso, count: counts[iso] || 0 }); }
    var max = Math.max(1, Math.max.apply(null, days.map(function (x) { return x.count; }))), every = Math.ceil(days.length / 8);
    return '<div class="trend">' + days.map(function (x, i) {
      return '<button type="button" class="tb' + (hasFacet("day", x.day) ? " on" : "") + '" data-day="' + x.day + '" title="' + shortDay(x.day) + ": " + x.count + ' created — click to filter"><i style="height:' + Math.max(x.count ? 4 : 1, 100 * x.count / max) + '%"></i><span>' + (i % every === 0 || i === days.length - 1 ? shortDay(x.day) : "") + "</span></button>";
    }).join("") + "</div>";
  }
  function pivot() {
    var shown = apply(rows), colsAll = tally(shown, ui.pvCol).sort(function (a, b) { return ui.pvCol === "day" ? (a.key < b.key ? 1 : -1) : b.count - a.count; }).slice(0, 8);
    var rowsAll = tally(shown, ui.pvRow).sort(function (a, b) { return ui.pvRow === "day" ? (a.key < b.key ? 1 : -1) : b.count - a.count; }).slice(0, 14);
    var body = rowsAll.map(function (r) {
      var cells = colsAll.map(function (c) { return r.rows.filter(function (x) { return norm(x[ui.pvCol]) === c.key; }).length; });
      return { r: r, cells: cells };
    });
    var max = Math.max(1, Math.max.apply(null, body.reduce(function (a, b) { return a.concat(b.cells); }, [])));
    var h = '<div class="card"><div class="card-h pivot-controls"><h2>Pivot</h2><span class="faint small">Rows</span><select data-sum="pvRow" style="width:auto">' + dimOptions(ui.pvRow) + '</select><span class="faint small">Columns</span><select data-sum="pvCol" style="width:auto">' + dimOptions(ui.pvCol) + "</select></div>" +
      '<div class="table-wrap" style="max-height:none" data-nopage><table class="t pivot" data-nopage><thead><tr><th>' + FIELD[ui.pvRow] + "</th>" + colsAll.map(function (c) { return '<th class="num pv-col" data-pvc="' + esc(c.value) + '">' + esc(c.label) + "</th>"; }).join("") + '<th class="num">Total</th></tr></thead><tbody>';
    body.forEach(function (b) {
      h += '<tr><td class="pv-row" data-pvr="' + esc(b.r.value) + '">' + esc(b.r.label) + "</td>" + b.cells.map(function (v, i) {
        return '<td class="num pv-cell' + (v ? "" : " zero") + '"' + (v ? ' data-pvr="' + esc(b.r.value) + '" data-pvc="' + esc(colsAll[i].value) + '" style="background:color-mix(in srgb, var(--accent) ' + Math.round(8 + 62 * v / max) + '%, transparent)"' : "") + ">" + (v ? v : "·") + "</td>";
      }).join("") + '<td class="num"><b>' + b.r.count + "</b></td></tr>";
    });
    if (!body.length) h += '<tr><td colspan="' + (colsAll.length + 2) + '" class="muted">No matching records</td></tr>';
    return h + "</tbody></table></div></div>";
  }
  function renderSummary() {
    if (!ui.summary) return;
    if (ui.sumTab === "pivot") { $("sumBody").innerHTML = pivot(); return; }
    var states = facetOptions("state").filter(function (t) { return t.count > 0; });
    var statuses = facetOptions("status").filter(function (t) { return t.count > 0; }).slice(0, 12);
    var top = facetOptions(ui.topDim).filter(function (t) { return t.count > 0; }).sort(function (a, b) { return (a.key === "") - (b.key === "") || b.count - a.count; }).slice(0, 10);
    $("sumBody").innerHTML = '<div class="grid g2 insight-grid">' +
      '<div class="card"><div class="card-h"><h2>By state</h2><span class="tag small faint">Online vs. offline</span></div><div class="card-b">' + barList(states, "state", true) + '<div class="legend mt-s"><span><i style="background:var(--accent)"></i>Online</span><span><i style="background:var(--ink-faint)"></i>Offline</span></div></div></div>' +
      '<div class="card"><div class="card-h"><h2>By status</h2></div><div class="card-b">' + barList(statuses, "status") + "</div></div>" +
      '<div class="card"><div class="card-h"><h2>Created per day</h2><span class="tag small faint">Click a bar to filter</span></div><div class="card-b">' + trend() + "</div></div>" +
      '<div class="card"><div class="card-h"><h2>Top 10 by</h2><select data-sum="topDim" style="width:auto">' + DIMS.filter(function (d) { return d !== "day"; }).map(function (d) { return '<option value="' + d + '"' + (d === ui.topDim ? " selected" : "") + ">" + FIELD[d] + "</option>"; }).join("") + '</select></div><div class="card-b">' + barList(top, ui.topDim) + "</div></div></div>";
  }
  $("sumBody").addEventListener("click", function (e) {
    var t = e.target, el;
    if ((el = t.closest("[data-bar]"))) { toggleFacet(el.getAttribute("data-bar"), el.getAttribute("data-v")); update({ panel: true }); return; }
    if ((el = t.closest("[data-day]"))) { toggleFacet("day", el.getAttribute("data-day")); update({ panel: true }); return; }
    if ((el = t.closest("[data-pvr],[data-pvc]"))) {
      var r = el.getAttribute("data-pvr"), c = el.getAttribute("data-pvc");
      if (r !== null) setFacet(ui.pvRow, [r]);
      if (c !== null) setFacet(ui.pvCol, [c]);
      update({ panel: true });
    }
  });
  $("sumBody").addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-sum"); if (!k) return;
    ui[k] = e.target.value; renderSummary();
  });
  $("sumTabs").addEventListener("segchange", function (e) { ui.sumTab = e.detail; renderSummary(); });
  $("summaryBtn").addEventListener("click", function () {
    ui.summary = !ui.summary; persist("cyrix.pi.summary", ui.summary ? "1" : "0"); applySummaryVisibility(); renderSummary();
  });
  function applySummaryVisibility() {
    $("summary").hidden = !ui.summary; $("summaryBtn").classList.toggle("on", ui.summary);
    $("summaryBtn").setAttribute("aria-expanded", String(ui.summary)); $("sumArrow").textContent = ui.summary ? "expand_less" : "expand_more";
  }

  /* ---------- table ---------- */
  function attachmentImageUrl(url) {
    if (/^assets\//.test(url)) return "../" + url;   // snapshot images live in ../assets
    try {
      var p = new URL(url, window.location.href), h = p.hostname.toLowerCase(), base = API.replace(/\/$/, "");
      if (h === "apcyrixbemp.com" && p.pathname.indexOf("/setups/item_img/") === 0) return base + "/ap-image?url=" + encodeURIComponent(p.href);
      if (h === "rmsclcyrix.mobilisepro.com" && p.pathname.indexOf("/scm/scm_files/") === 0) return base + "/rj-image?url=" + encodeURIComponent(p.href);
      if (h === "cyrixbemp.com" && p.pathname.indexOf("/scm/scm_files/") === 0) return base + "/kerala-image?url=" + encodeURIComponent(p.href);
    } catch (e) {}
    return url;
  }
  function thumbs(urls) {
    if (!urls || !urls.length) return '<span class="muted">—</span>';
    return '<div class="thumb-trigger" data-images=\'' + JSON.stringify(urls).replace(/&/g, "&amp;").replace(/'/g, "&#39;") + '\' title="View ' + urls.length + ' image' + (urls.length > 1 ? "s" : "") + '"><img src="' + esc(attachmentImageUrl(urls[0])) + '" loading="lazy" alt="PI attachment" onerror="this.style.visibility=\'hidden\'">' + (urls.length > 1 ? '<span class="count">' + urls.length + "</span>" : "") + "</div>";
  }
  var shown = [];
  function sortRows(list) {
    var k = ui.sortKey, d = ui.sortDir;
    if (k === "__date") return list.slice().sort(function (a, b) { return b.ts - a.ts; });
    if (k === "date") return list.slice().sort(function (a, b) { return (a.ts - b.ts) * d; });
    if (k === "images") return list.slice().sort(function (a, b) { return (a.images.length - b.images.length) * d; });
    return list.slice().sort(function (a, b) { var x = norm(a[k]), y = norm(b[k]); return x < y ? -d : x > y ? d : 0; });
  }
  // Each portal names its columns differently; the raw view shows them as the portal does.
  var RAWMAP = {
    AP: { id: "Indent No - Line No", desc: "Item Desc.", requestor: "Requestor", status: "Status", date: "Created Date" },
    Kerala: { id: "Indent No", desc: "Item Desc.", requestor: "Requestor", status: "Status", date: "Indent Date" },
    UP: { id: "MPTID", desc: "PR Description", requestor: "Req User", status: "STATUS", date: "Req Date" }
  };
  RAWMAP.Rajasthan = RAWMAP.AP;
  function renderRaw() {
    var keys = ["id", "desc", "requestor", "status", "date"], states = [];
    shown.forEach(function (r) { if (states.indexOf(r.state) < 0) states.push(r.state); });
    var extra = shown.length && shown[0].heldBy !== undefined;
    $("rawGroups").innerHTML = states.map(function (st) {
      var list = shown.filter(function (r) { return r.state === st; }), m = RAWMAP[st] || RAWMAP.AP;
      var head = "<th>State</th><th>Type</th>" + keys.map(function (k) { return "<th>" + esc(m[k]) + "</th>"; }).join("") + "<th>Images</th>" + (extra ? "<th>Held by</th>" : "");
      var body = list.map(function (r) {
        return '<tr class="row-click" data-i="' + shown.indexOf(r) + '"><td><span class="badge">' + esc(r.state) + '</span></td><td><span class="badge ' + (r.call_type === "current_call" ? "info" : "warn") + '">' + r.typeL + "</span></td>" +
          keys.map(function (k) { return '<td title="' + esc(r[k]) + '">' + (k === "desc" ? esc((r.desc || "—").slice(0, 180)) : esc(r[k]) || "—") + "</td>"; }).join("") +
          "<td>" + thumbs(r.images) + "</td>" + (extra ? '<td><a href="employee-workload.html?id=' + r.heldId + '">' + esc(r.heldBy) + '</a><div class="small faint">' + esc(r.heldTeam) + "</div></td>" : "") + "</tr>";
      }).join("");
      return '<div class="state-block"><h3 class="state-block-title">' + esc(st) + ' <span class="muted">(' + list.length + ')</span></h3><div class="table-wrap"><table class="t full-table"><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div></div>";
    }).join("") || '<p class="muted">No matching records.</p>';
  }
  function renderTable() {
    shown = sortRows(apply(rows));
    var raw = ui.view === "raw";
    $("tableWrap").style.display = raw ? "none" : ""; $("rawGroups").hidden = !raw; $("colsWrap").hidden = raw;
    if (raw) {
      renderRaw();
      $("rowcount").innerHTML = "<b>" + fmt(shown.length) + "</b> of " + fmt(rows.length) + " sample records" + (isFiltered() ? " match" : "") + " · raw portal columns (the sample stores only the fields shown)";
      return;
    }
    var cols = COLS.filter(function (c) { return ui.cols.indexOf(c[0]) >= 0; });
    $("thead").innerHTML = "<tr>" + cols.map(function (c) { return '<th data-k="' + c[0] + '">' + c[1] + (ui.sortKey === c[0] ? '<span class="faint"> ' + (ui.sortDir === 1 ? "▲" : "▼") + "</span>" : "") + "</th>"; }).join("") + "</tr>";
    $("recordRows").innerHTML = shown.map(function (r, i) {
      return '<tr class="row-click" data-i="' + i + '">' + cols.map(function (c) {
        switch (c[0]) {
          case "state": return '<td><span class="badge">' + esc(r.state) + "</span></td>";
          case "typeL": return '<td><span class="badge ' + (r.call_type === "current_call" ? "info" : "warn") + '">' + r.typeL + "</span></td>";
          case "heldBy": return '<td><a href="employee-workload.html?id=' + r.heldId + '">' + esc(r.heldBy) + '</a><div class="small faint">' + esc(r.heldTeam) + "</div></td>";
          case "images": return "<td>" + thumbs(r.images) + "</td>";
          case "desc": return '<td class="desc" title="' + esc(r.desc) + '">' + esc((r.desc || "—").slice(0, 180)) + "</td>";
          default: return '<td title="' + esc(r[c[0]]) + '">' + (esc(r[c[0]]) || "—") + "</td>";
        }
      }).join("") + "</tr>";
    }).join("");
    $("rowcount").innerHTML = "<b>" + fmt(shown.length) + "</b> of " + fmt(rows.length) + " sample records" + (isFiltered() ? " match" : "") + " · click a row for details";
    $("colsCount").textContent = "(" + cols.length + ")";
  }
  $("thead").addEventListener("click", function (e) {
    var th = e.target.closest("th"); if (!th) return;
    var k = th.getAttribute("data-k"); ui.sortDir = ui.sortKey === k ? -ui.sortDir : 1; ui.sortKey = k; renderTable();
  });
  $("viewSeg").addEventListener("segchange", function (e) { ui.view = e.detail; closePops(); renderTable(); });
  $("rawGroups").addEventListener("click", function (e) {
    if (e.target.closest(".thumb-trigger, a")) return;
    var tr = e.target.closest("tr[data-i]"); if (tr) openDrawer(shown[+tr.getAttribute("data-i")]);
  });
  $("recordRows").addEventListener("click", function (e) {
    if (e.target.closest(".thumb-trigger") || e.target.closest("a")) return;
    var tr = e.target.closest("tr[data-i]"); if (tr) openDrawer(shown[+tr.getAttribute("data-i")]);
  });

  /* columns picker */
  function renderCols() {
    $("colsList").innerHTML = COLS.map(function (c) { return '<label class="facet-opt"><input type="checkbox" data-col="' + c[0] + '"' + (ui.cols.indexOf(c[0]) >= 0 ? " checked" : "") + '><span class="facet-l">' + c[1] + "</span></label>"; }).join("");
  }
  $("colsPop").addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-col"); if (!k) return;
    ui.cols = COLS.map(function (c) { return c[0]; }).filter(function (x) { return x === k ? e.target.checked : ui.cols.indexOf(x) >= 0; });
    if (!ui.cols.length) { ui.cols = [k]; renderCols(); }
    renderTable();
  });
  $("colsPop").addEventListener("click", function (e) { if (e.target.closest('[data-cols="all"]')) { ui.cols = COLS.map(function (c) { return c[0]; }); renderCols(); renderTable(); } });

  /* export */
  $("exportBtn").addEventListener("click", function () {
    var cols = COLS.filter(function (c) { return ui.cols.indexOf(c[0]) >= 0; });
    var cell = function (v) { v = String(v == null ? "" : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var val = function (r, k) { return k === "images" ? r.images.join(" ") : r[k]; };
    var body = [cols.map(function (c) { return c[1]; })].concat(shown.map(function (r) { return cols.map(function (c) { return val(r, c[0]); }); })).map(function (r) { return r.map(cell).join(","); }).join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿", body], { type: "text/csv;charset=utf-8" }));
    a.download = "pi-unified-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click(); URL.revokeObjectURL(a.href);
  });

  /* ---------- drawer + gallery ---------- */
  function openDrawer(r) {
    if (!r) return;
    $("drawerBadges").innerHTML = '<span class="badge">' + esc(r.state) + '</span><span class="badge ' + (r.call_type === "current_call" ? "info" : "warn") + '">' + r.typeL + '</span><span class="badge">' + esc(r.status) + "</span>";
    $("drawerTitle").textContent = r.id || "Record"; $("drawerDesc").textContent = r.desc;
    var kv = [["Indent / Ticket", r.id], ["Description", r.desc], ["State", r.state], ["Call type", r.typeL], ["Status", r.status], ["Status group", r.group], ["Requestor", r.requestor], ["Held by", r.heldBy], ["Team", r.heldTeam], ["Date", r.date]].filter(function (x) { return x[1]; });
    $("drawerBody").innerHTML = (r.images.length ? "<section><h3>Attachments (" + r.images.length + ')</h3><div class="gallery-grid">' + r.images.map(function (u) { var s = esc(attachmentImageUrl(u)); return '<a href="' + s + '" target="_blank" rel="noopener"><img src="' + s + '" loading="lazy" alt="PI attachment" onerror="this.style.visibility=\'hidden\'"></a>'; }).join("") + "</div></section>" : "") +
      '<section><h3>Details</h3><dl class="kv">' + kv.map(function (x) { return '<div class="kv-row"><dt>' + x[0] + "</dt><dd>" + esc(x[1]) + "</dd></div>"; }).join("") + "</dl></section>";
    $("drawerBg").hidden = false;
  }
  function closeDrawer() { $("drawerBg").hidden = true; }
  $("drawerClose").addEventListener("click", closeDrawer);
  $("drawerBg").addEventListener("click", function (e) { if (e.target === $("drawerBg")) closeDrawer(); });
  document.addEventListener("click", function (e) {
    var t = e.target.closest(".thumb-trigger"); if (!t) return;
    try {
      $("galleryBody").innerHTML = JSON.parse(t.getAttribute("data-images")).map(function (u) { var s = esc(attachmentImageUrl(u)); return '<a href="' + s + '" target="_blank" rel="noopener"><img src="' + s + '" loading="lazy" alt="PI attachment" onerror="this.style.visibility=\'hidden\'"></a>'; }).join("");
      $("galleryModal").classList.add("show");
    } catch (err) {}
  });

  /* ---------- layout + orchestration ---------- */
  function layout() {
    $("layout").classList.toggle("no-filters", !ui.filters);
    $("filterPanel").hidden = !ui.filters; $("showFilters").hidden = ui.filters;
  }
  $("showFilters").addEventListener("click", function () { ui.filters = true; layout(); });

  function update(o) {
    if (o && o.panel) renderPanel();
    renderStage(); renderChips(); renderSummary(); renderTable();
  }
  var range = CXR.create($("range"), function () { load(); });
  function load() {
    if (!ALL.length) { $("empty").hidden = false; $("body").hidden = true; return; }
    rows = ALL.filter(function (r) { return range.contains(r.date); });
    var s = MOCK.summary;
    $("subtitle").textContent = range.label() + " · " + rows.length + " sample records" + (s ? " (of " + s.counts.total + " pooled, same as employees see)" : "");
    renderSync(); renderCols(); applySummaryVisibility(); layout(); update({ panel: true });
  }
  $("refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
